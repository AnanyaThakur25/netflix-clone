<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
        }
        header{
            height: 800px;
            background-image: linear-gradient(to bottom,rgb(59, 21, 23) 40%,rgba(49, 13, 16)50%,rgba(31, 6, 7)90%,rgba(31, 6, 7)90%,rgb(23, 1, 2)100%,black,black
            );

        }
        .nav{
            padding: 15px;
            height: 60px;
            border-bottom: 1px solid rgb(218, 111, 111);
        }
        .logo{
            background-image: url(photos/Netflix_Logo_PMS.png);
            background-size: cover;
            height: 60px;
            width: 170px;
            margin-left: 120px;
            
        }
        .info{
            height: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 50px;
        }
        .form{
            
            width: 450px;
            height: 600px;

        }
        h1{
            color: white;
            font-size: 34px;
            letter-spacing: 1px;
        }
        .para{
            margin-top: 5px;
            font-family:Cambria, Cochin, Georgia;
            font-size: 19.5px;
            color: rgb(173, 169, 169);
            font-width: lighter;
        }
        input{
            width: 450px;
            height: 40px;
            background-color:rgb(29, 19, 19);
            border: 1px solid grey;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: large;
            padding: 5px;
            margin-top: 25px;
        }
        button{
            background-color: red;
             height: 50px;
            width: 460px;
            border: 2px solid red;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: large;
            font-width: 2rem;
            padding: 5px;
            margin-top: 15px;
            color: white;
            margin-bottom: 50px;
        }
        .get{
            margin-top: 100px;
            color: white;
          font-family: sans-serif;
            text-decoration: none;
            font-size: 18px;
        }
        .pg{
            margin-top: 30px;
            font-family:Cambria, Cochin, Georgia;
            font-size: 14.5px;
            color: rgb(173, 169, 169);
            font-width: lighter; 
        }
        .foot{
           
            background-color: #1f1e1e;
            color: rgb(138, 134, 134);
            height: 300px;
        }
        .content{
            width: 1000px;
            padding: 70px;
            padding-left: 100px;
            line-height: 35px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman';
        }
        .links{
            margin-top: 30px;
            width: 180px;
            color: rgb(138, 134, 134);
            margin-left: 180px;
        }
        .link{
 margin-top: 30px;
            width: 180px;
            color: rgb(138, 134, 134);
            margin-left: 80px;
        }
        .list{
            margin-top: 30px;
            width: 180px;
            color:  rgb(138, 134, 134);
            margin-left: 75px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <div class="logo"></div>
        </div>
        <div class="info">
        <div class="form">
            <h1>Enter your info to sign in</h1>
            <p class="para">Or get started with a new account.</p>
            <input type="text" placeholder="Email or Phone number">
            <button>Continue</button>
            <a href="" class="get">Get Help </a>
            <p class="pg">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
        </div>
</div>
    </header>   
        <footer>
            <div class="foot">
                <div class="content">
                    <p  style="font-size: 16px; font-width: lighter; margin-left: 80px;">Questions? Call 000-800-919-1743 (Toll-Free)</p>
                    
                    <a href="" class="link">FAQ</a>
                    <a href="" class="links"> Help Centre</a>
                    <a href="" class="links">Terms of Use</a>
                    <a href="" class="links">Privacy</a>
                    <a href="" class="link">Cookie Preferences</a>
                    <a href="" class="list">Corporate Information</a>
                </div>
            </div>
        </footer>
    
</body>
</html>
